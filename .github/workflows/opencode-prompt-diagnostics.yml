name: Free DeepSeek Prompt Diagnostics

on:
  push:
    branches:
      - benchmark/longmemeval-20261025
    paths:
      - .github/workflows/opencode-prompt-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCode
        run: npm install --global opencode-ai@latest
      - name: Probe increasingly long factual contexts
        run: |
          mkdir -p /tmp/mind-prompt-diagnostic
          cd /tmp/mind-prompt-diagnostic
          python3 - <<'PY'
          from pathlib import Path
          base='There is a person named Alex. Their favorite number is 42 and favorite city is Porto. '
          for n in (0,20,100):
              prompt='Conversation history:\n' + base*n + '\nQuestion: What is Alex favorite number? Answer in one word.'
              Path(f'/tmp/prompt-{n}.txt').write_text(prompt)
          PY
          for n in 0 20 100; do
            echo "PROBE_SIZE $n $(wc -c < /tmp/prompt-$n.txt)"
            set +e
            timeout 65s opencode run --model opencode/deepseek-v4.1-flash-free \
              --format json "$(cat /tmp/prompt-$n.txt)" \
              > /tmp/probe-$n.jsonl 2>/tmp/probe-$n.err
            status=$?
            set -e
            echo "PROBE_STATUS $n $status"
            node -e 'const fs=require("fs"); let out=[]; let errors=[];for(let line of fs.readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean)){try{const j=JSON.parse(line);if(j.type==="text")out.push(j.part?.text);if(j.type==="error")errors.push(JSON.stringify(j).slice(0,500))}catch{}}console.log(JSON.stringify({text:out.join("").slice(0,300),errors,events:fs.readFileSync(process.argv[1],"utf8").split("\n").length}))' /tmp/probe-$n.jsonl
            echo "STDERR $n $(head -c 400 /tmp/probe-$n.err)"
          done
