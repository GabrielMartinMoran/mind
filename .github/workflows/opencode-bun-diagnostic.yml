name: Bun OpenCode Child Process Diagnostic
on:
  push:
    branches:
      - benchmark/longmemeval-20261025
    paths:
      - .github/workflows/opencode-bun-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global opencode-ai@latest
      - name: Probe CLI invoked via Bun.spawn
        run: |
          mkdir -p /tmp/mind-longmemeval-opencode
          cat >/tmp/mind-bun-test.mjs <<'EOF'
          import { mkdirSync } from 'node:fs';
          const dir='/tmp/mind-longmemeval-opencode';
          mkdirSync(dir,{recursive:true});
          async function test(n){
            const prompt='SYSTEM:\nAnswer based only on given history.\n\nUSER:\nConversation history:\n' + 'Alex likes blue. '.repeat(n) + '\nQuestion: Which color does Alex like?\nANSWER:';
            console.log('BEGIN',n,prompt.length);
            const controller=new AbortController();
            const timeout=setTimeout(()=>controller.abort(),18000);
            try{
              const proc=Bun.spawn(['opencode','run','--model','opencode/deepseek-v4.1-flash-free','--format','json','--title','LongMemEval QA '+Date.now(),prompt],{cwd:dir,stdout:'pipe',stderr:'pipe',signal:controller.signal,stdin:'ignore'});
              const [stdout,stderr,exit]=await Promise.all([new Response(proc.stdout).text(),new Response(proc.stderr).text(),proc.exited]);
              console.log('END',n,exit,stdout.length,stderr.slice(0,300));
              console.log('EVENTS',stdout.split('\n').filter(Boolean).slice(-5).map(x=>{try{const j=JSON.parse(x);return {type:j.type,text:j.part?.text}}catch{return x.slice(0,40)}}));
            }catch(e){console.log('FAILED',n,String(e));}finally{clearTimeout(timeout)}
          }
          await test(3);
          await test(100);
          EOF
          bun /tmp/mind-bun-test.mjs
