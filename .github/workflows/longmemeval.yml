name: LongMemEval-S retrieval pilot

on:
  push:
    branches:
      - benchmark/longmemeval-20261025
    paths:
      - benchmarks/longmemeval/**
      - .github/workflows/longmemeval.yml
  workflow_dispatch:
    inputs:
      count:
        description: Number of stratified questions (1-500)
        required: true
        default: '500'

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download official LongMemEval-S
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json' \
            -o /tmp/longmemeval_s_cleaned.json
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" -gt 100000000
      - name: Evaluate Mind versus BM25
        run: |
          bun benchmarks/longmemeval/run.mjs \
            --input=/tmp/longmemeval_s_cleaned.json \
            --count=${{ inputs.count || '500' }} \
            --output=benchmarks/longmemeval/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longmemeval-retrieval-${{ github.sha }}
          path: benchmarks/longmemeval/results.json
          if-no-files-found: warn
