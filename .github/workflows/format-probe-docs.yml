name: Temporary benchmark docs formatter probe
on:
  push:
    branches: [docs/omnimemeval-compact-score-20261026]
    paths: [.github/workflows/format-probe-docs.yml]
permissions:
  contents: read
jobs:
  formatting-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show expected Prettier changes
        run: |
          bunx prettier --write README.md benchmarks/omnimemeval/README.md
          git diff -- README.md benchmarks/omnimemeval/README.md
