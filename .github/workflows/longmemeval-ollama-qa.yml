name: LongMemEval QA offline model pilot
on:
  push:
    branches: [benchmark/longmemeval-20261025]
    paths: [.github/workflows/longmemeval-ollama-qa.yml]
  workflow_dispatch:
    inputs:
      count:
        description: How many stratified QA questions to evaluate
        default: '12'
        required: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install local open-source model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          (ollama serve >/tmp/ollama-serve.log 2>&1 &)
          for n in $(seq 1 50); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b
          ollama list
      - name: Get LongMemEval-S
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json' \
            -o /tmp/longmemeval_s_cleaned.json
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" -gt 100000000
      - name: Reproduce retrieval
        run: |
          bun benchmarks/longmemeval/run.mjs \
            --input=/tmp/longmemeval_s_cleaned.json \
            --count=${{ inputs.count || '12' }} \
            --output=benchmarks/longmemeval/offline-retrieval.json
      - name: Evaluate all three arms
        run: |
          bun benchmarks/longmemeval/answer.mjs \
            --provider=ollama \
            --model=qwen2.5:3b \
            --input=/tmp/longmemeval_s_cleaned.json \
            --retrieval=benchmarks/longmemeval/offline-retrieval.json \
            --count=${{ inputs.count || '12' }} \
            --output=benchmarks/longmemeval/offline-qa.json
      - name: Archive paired outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-qa-offline-${{ github.sha }}
          path: |
            benchmarks/longmemeval/offline-retrieval.json
            benchmarks/longmemeval/offline-qa.json
          if-no-files-found: warn
