name: LongMemEval OpenRouter RAG A/B (manual, metered)

on:
  workflow_dispatch:
    inputs:
      count:
        description: Questions (pilot 12; increase only after cost/quality validation)
        type: choice
        required: true
        default: '12'
        options:
          - '3'
          - '6'
          - '12'
          - '30'
      qa_budget_usd:
        description: Soft spend ceiling for answering + judging, excludes embeddings
        type: choice
        required: true
        default: '0.75'
        options:
          - '0.25'
          - '0.75'
          - '2'

permissions:
  contents: read

concurrency:
  group: longmemeval-openrouter-paid
  cancel-in-progress: false

jobs:
  qa:
    environment: Develop
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check secret exists (never print its value)
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY as a secret in the Develop GitHub Environment"
            exit 1
          fi
          echo "OpenRouter credential available"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Syntax-check benchmark scripts
        run: |
          node --check benchmarks/longmemeval/run.mjs
          node --check benchmarks/longmemeval/answer.mjs
      - name: Download official LongMemEval-S
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json' \
            -o /tmp/longmemeval_s_cleaned.json
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" -gt 100000000
      - name: Index every memory once and run RAG OFF / ON and BM25
        run: |
          bun benchmarks/longmemeval/run.mjs \
            --rag=both \
            --input=/tmp/longmemeval_s_cleaned.json \
            --count=${{ inputs.count }} \
            --output=benchmarks/longmemeval/openrouter-retrieval.json
      - name: Run paired QA with DeepSeek Flash and independent mini judge
        run: |
          bun benchmarks/longmemeval/answer.mjs \
            --provider=openrouter \
            --model=deepseek/deepseek-v4.1-flash-1017 \
            --judge-model=openai/gpt-4o-mini \
            --arms=mindRagOff,mindRagOn,bm25,no-memory \
            --sessions=5 --session-chars=3000 \
            --input=/tmp/longmemeval_s_cleaned.json \
            --retrieval=benchmarks/longmemeval/openrouter-retrieval.json \
            --count=${{ inputs.count }} \
            --max-usd=${{ inputs.qa_budget_usd }} \
            --output=benchmarks/longmemeval/openrouter-qa.json
      - name: Upload reproducible inputs, retrieval, answers and judge decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-openrouter-${{ github.run_id }}
          path: |
            benchmarks/longmemeval/openrouter-retrieval.json
            benchmarks/longmemeval/openrouter-qa.json
          if-no-files-found: warn
