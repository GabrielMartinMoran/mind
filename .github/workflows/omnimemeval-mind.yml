name: OmniMemEval LongMemEval-S (manual)

on:
  workflow_dispatch:
    inputs:
      rag_mode:
        description: Optional semantic embeddings in Mind
        type: choice
        required: true
        default: 'off'
        options: ['off', 'on']
      sample_size:
        description: Balanced questions (500 = complete official dataset)
        required: true
        default: '120'
        type: choice
        options: ['60', '120', '500']

permissions:
  contents: read

concurrency:
  group: omnimemeval-mind-paid
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: Develop
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONUNBUFFERED: '1'
      MIND_RAG: ${{ inputs.rag_mode == 'on' && 'true' || 'false' }}
      MIND_EMBEDDING_PROVIDER: openrouter
      LLM_MAX_RETRIES: '2'
      OMNIMEMEVAL_MEMORY_MAX_RETRIES: '2'
      HF_HOME: /tmp/omnimemeval-hf
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate credentials
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OPENROUTER_API_KEY is missing in Develop environment"; exit 1; }
          echo "Benchmark credentials available (not displayed)"
      - name: Verify OpenRouter remaining budget
        run: python benchmarks/omnimemeval/check_openrouter_budget.py ${{ inputs.sample_size || '120' }}
      - name: Install Mind dependencies
        run: bun install --frozen-lockfile
      - name: Fetch and pin official OmniMemEval
        run: |
          git clone -q https://github.com/MemTensor/OmniMemEval.git /tmp/omnimemeval
          git -C /tmp/omnimemeval checkout -q f7476c5502115542eca9971195bf8c5ca97b6256
          python benchmarks/omnimemeval/install_adapter.py /tmp/omnimemeval
          echo "Official OmniMemEval source: $(git -C /tmp/omnimemeval rev-parse HEAD)"
      - name: Install official evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r /tmp/omnimemeval/requirements_user_memory.txt
      - name: Download official LongMemEval-S
        working-directory: /tmp/omnimemeval
        run: python data/longmemeval/prepare_longmemeval.py --variant s
      - name: Choose deterministic stratified questions
        working-directory: /tmp/omnimemeval
        run: python "$GITHUB_WORKSPACE/benchmarks/omnimemeval/stratify.py" data/longmemeval/longmemeval_s_cleaned.json ${{ inputs.sample_size || '120' }}
      - name: Run official QA and judge stages against Mind
        run: |
          umask 077
          cat >/tmp/omnimemeval/.env.mind <<EOF
          ANSWER_MODEL=openai/gpt-6-luna
          ANSWER_BASE_URL=https://openrouter.ai/api/v1
          ANSWER_API_KEY=$OPENROUTER_API_KEY
          EVAL_MODEL=openai/gpt-6-luna
          EVAL_BASE_URL=https://openrouter.ai/api/v1
          EVAL_API_KEY=$OPENROUTER_API_KEY
          TOPK=20
          LLM_WORKERS=2
          EOF
          bun benchmarks/omnimemeval/bridge.ts > /tmp/mind-omnimemeval-bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:40315/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:40315/health
          cd /tmp/omnimemeval
          bash scripts/run_lme_eval.sh --lib mind --env .env.mind --version luna-low-rag-${{ inputs.rag_mode || 'off' }}-${{ github.run_id }} \
            --streaming 1 --start-idx 0 --end-idx $((${{ inputs.sample_size || '120' }} - 1)) \
            --top-k 20 --llm-workers 2 --num-runs 1 --allow-empty-search 1
      - name: Archive results (includes failures for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnimemeval-mind-${{ github.run_id }}
          path: |
            /tmp/omnimemeval/results/lme/mind-*/
            /tmp/mind-omnimemeval-bridge.log
          if-no-files-found: warn
          retention-days: 14
