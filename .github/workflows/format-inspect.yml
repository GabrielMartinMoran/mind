name: Temporary formatting and targeted verification
on:
  push:
    branches: [benchmark/longmemeval-20261025]
    paths: [.github/workflows/format-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show exact Prettier-required patch
        run: |
          bunx prettier --write src/store/shared/natural-search.ts test/search-natural-recall.spec.ts
          git diff -- src/store/shared/natural-search.ts test/search-natural-recall.spec.ts
      - name: Run targeted search tests
        run: bun test test/search-natural-recall.spec.ts test/search-eval.spec.ts test/search-scenarios.spec.ts
