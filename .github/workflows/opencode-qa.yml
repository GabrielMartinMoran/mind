name: LongMemEval-S QA DeepSeek Flash Free

on:
  push:
    branches:
      - benchmark/longmemeval-20261025
    paths:
      - benchmarks/longmemeval/answer.mjs
      - .github/workflows/opencode-qa.yml
  workflow_dispatch:
    inputs:
      count:
        description: Number of stratified questions for QA (1-500)
        required: true
        default: '12'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Mind dependencies
        run: bun install --frozen-lockfile
      - name: Install free-model OpenCode CLI
        run: |
          npm install --global opencode-ai@latest
          opencode --version
          opencode models opencode | grep 'deepseek-v4.1-flash-free'
      - name: Download official 500-question LongMemEval-S
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json' \
            -o /tmp/longmemeval_s_cleaned.json
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" -gt 100000000
      - name: Retrieve with Mind and BM25
        run: |
          bun benchmarks/longmemeval/run.mjs \
            --input=/tmp/longmemeval_s_cleaned.json \
            --count=${{ inputs.count || '12' }} \
            --output=benchmarks/longmemeval/retrieval-qa.json
      - name: Answer and judge with free DeepSeek Flash
        run: |
          bun benchmarks/longmemeval/answer.mjs \
            --provider=opencode \
            --model=opencode/deepseek-v4.1-flash-free \
            --input=/tmp/longmemeval_s_cleaned.json \
            --retrieval=benchmarks/longmemeval/retrieval-qa.json \
            --count=${{ inputs.count || '12' }} \
            --output=benchmarks/longmemeval/qa-deepseek-free.json
      - name: Upload raw answers and judge decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-qa-deepseek-${{ github.sha }}
          path: |
            benchmarks/longmemeval/retrieval-qa.json
            benchmarks/longmemeval/qa-deepseek-free.json
          if-no-files-found: warn
