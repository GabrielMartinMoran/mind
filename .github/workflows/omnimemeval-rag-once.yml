# One-time A/B requested for the 2026-10-26 develop snapshot.
# Delete this workflow when the comparison has run; production is manual only.
name: One-time OmniMemEval A/B from develop
on:
  push:
    branches: [benchmark/omnimemeval-rag-ab-20261026]
    paths: [.github/workflows/omnimemeval-rag-once.yml]
permissions:
  contents: read
jobs:
  compare:
    name: OmniMemEval 120 questions — RAG ${{ matrix.rag_mode }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rag_mode: ['off', 'on']
    uses: ./.github/workflows/omnimemeval-mind.yml
    with:
      sample_size: '120'
      rag_mode: ${{ matrix.rag_mode }}
    secrets: inherit
