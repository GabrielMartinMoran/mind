name: Temporary exact Prettier probe
on:
  push:
    branches: [benchmark/longmemeval-20261025]
    paths: [.github/workflows/prettier-probe.yml]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Print exact formatted file
        run: |
          bunx prettier --write test/search-natural-recall.spec.ts
          echo '===PRETTIER_START==='
          cat test/search-natural-recall.spec.ts
          echo '===PRETTIER_END==='
      - name: Focused regression tests
        run: bun test test/search-natural-recall.spec.ts test/search-eval.spec.ts test/search-scenarios.spec.ts
