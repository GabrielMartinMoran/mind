name: Temporary README formatter inspection
on:
  push:
    branches: [docs/omnimemeval-readme-manual]
    paths: [.github/workflows/readme-format-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Print exact README formatting diff
        run: |
          bunx prettier --write README.md
          git diff -- README.md
