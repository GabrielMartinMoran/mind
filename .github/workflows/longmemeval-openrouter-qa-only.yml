name: LongMemEval OpenRouter QA-only 12
on:
  push:
    branches: [benchmark/longmemeval-20261025]
    paths: [.github/workflows/longmemeval-openrouter-qa-only.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: longmemeval-openrouter-paid
  cancel-in-progress: false
jobs:
  qa:
    environment: Develop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Require environment secret
        run: |
          test -n "$OPENROUTER_API_KEY" || (echo "::error::Missing secret in Develop" && exit 1)
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download previously generated retrieval from 12-question run
        uses: actions/download-artifact@v4
        with:
          name: longmemeval-openrouter-40204826616
          run-id: 40204826616
          github-token: ${{ github.token }}
          path: benchmarks/longmemeval
      - name: Verify complete RAG retrieval exists before spending
        run: |
          node -e 'const fs=require("fs");const path="benchmarks/longmemeval/openrouter-retrieval.json";const x=JSON.parse(fs.readFileSync(path,"utf8"));if(x.count!==12 || !x.fullyEmbedded || x.semanticInvocations!==12 || x.perQuestion.length!==12 || x.perQuestion.some(q=>!Array.isArray(q.mindRagOn)))process.exit(1);console.log("Validated 12 previously embedded cases")'
      - name: Download official dataset
        run: |
          curl -fL --retry 4 --retry-delay 5 'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json' -o /tmp/longmemeval_s_cleaned.json
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" -gt 100000000
      - name: Answer all 12 questions with 4 arms and independent judge
        run: |
          bun benchmarks/longmemeval/answer.mjs \
            --provider=openrouter --model=deepseek/deepseek-v4.1-flash-1017 \
            --judge-model=openai/gpt-4o-mini \
            --arms=mindRagOff,mindRagOn,bm25,no-memory \
            --sessions=5 --session-chars=3000 \
            --input=/tmp/longmemeval_s_cleaned.json \
            --retrieval=benchmarks/longmemeval/openrouter-retrieval.json \
            --count=12 --max-usd=0.25 \
            --output=benchmarks/longmemeval/openrouter-qa-12.json
      - name: Verify four-arm paired score
        run: |
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("benchmarks/longmemeval/openrouter-qa-12.json","utf8"));const arms=["mindRagOff","mindRagOn","bm25","no-memory"];if(x.cases.length!==12 || arms.some(a=>x.scores[a]?.judged!==12))process.exit(1);console.log("12 fully judged cases:",JSON.stringify(x.scores))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longmemeval-openrouter-qa12-${{ github.run_id }}
          path: |
            benchmarks/longmemeval/openrouter-retrieval.json
            benchmarks/longmemeval/openrouter-qa-12.json
          if-no-files-found: warn
