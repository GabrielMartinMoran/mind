name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc --noEmit

      - name: Check formatting (prettier)
        run: bun run format --check || npx prettier --check .

      - name: Lint
        run: bun run lint

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Run tests
        run: bun test test/ web/test

  benchmark-agent-memory:
    name: Benchmark (agent-memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks/agent-memory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install benchmark dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit and contract tests
        run: bun test test

      - name: Experiment tests
        run: bun test experiments
