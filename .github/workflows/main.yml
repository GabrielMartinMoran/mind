name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Check formatting (prettier)
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # Dependency audit is intentionally not gated: `bun audit --audit-level=high`
      # currently fails on pre-existing vulnerabilities (2026-10-20: root 27 =
      # 1 critical + 26 high; root prod 14 = 1 critical + 13 high; benchmark 2 high).
      # Dependency upgrades are a separate follow-up; audit failures are not
      # suppressed in this workflow.

      - name: Run tests
        run: bun test test/ web/test

  benchmark-agent-memory:
    name: Benchmark (agent-memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks/agent-memory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install benchmark dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit and contract tests
        run: bun test test

      - name: Experiment tests
        run: bun test experiments
