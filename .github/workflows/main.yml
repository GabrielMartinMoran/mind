name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (high)
        run: bun audit --audit-level=high

      - name: Type check (root + web)
        run: bun run typecheck

      - name: Check formatting (prettier)
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test test/ web/test

  benchmark-agent-memory:
    name: Benchmark (agent-memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks/agent-memory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install benchmark dependencies
        run: bun install --frozen-lockfile

      - name: Audit benchmark dependencies (high)
        run: bun audit --audit-level=high

      - name: Type check
        run: bun run typecheck

      - name: Unit and contract tests
        run: bun test test

      - name: Experiment tests
        run: bun test experiments
